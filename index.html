<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handling Jotform Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --di-purple: #5000B3;
    --di-purple-deep: #3B0086;
    --di-orange: #FF6300;
    --di-orange-deep: #E84500;
    --di-ink: #181818;
    --di-grey-mid: #999999;
    --di-grey-light: #F4F4F4;
    --di-grey-line: #E8E8E8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'Roboto', Arial, sans-serif; font-size: 16px;
    color: var(--di-ink); background: #fff;
  }
  h1, h2, h3 { font-weight: 700; margin: 0; }
  p { line-height: 1.65; color: #333; }
  button { font-family: 'Roboto', Arial, sans-serif; }
  a.link-btn { color: var(--di-purple); font-size: 13.5px; cursor: pointer; text-decoration: underline; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  #cover {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--di-purple); color: #fff; text-align: center; padding: 60px 24px;
  }
  #cover .notion-logo { font-size: 64px; margin-bottom: 20px; }
  #cover h1 { font-size: 30px; max-width: 520px; margin-bottom: 16px; }
  #cover p { color: rgba(255,255,255,0.8); font-size: 15px; max-width: 440px; margin: 0 auto 36px; }

  #menu { flex: 1; display: none; flex-direction: column; }
  .menu-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 40px 0;
  }
  .menu-header .brand { font-size: 15px; font-weight: 700; color: var(--di-purple); letter-spacing: .02em; }
  .menu-wrap { flex: 1; max-width: 680px; margin: 0 auto; padding: 30px 40px 40px; width: 100%; }
  .menu-wrap h2 { font-size: 26px; margin-bottom: 4px; }
  .menu-sub { color: #666; font-size: 14px; margin-bottom: 24px; }
  .lesson-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 4px; border-top: 1px solid var(--di-grey-line); cursor: pointer;
  }
  .lesson-row:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .lesson-row:hover .lesson-title { color: var(--di-purple); }
  .lesson-row-left { display: flex; align-items: center; gap: 16px; }
  .lesson-num {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--di-grey-line); color: var(--di-grey-mid);
  }
  .lesson-num.done { background: #1E8E3E; border-color: #1E8E3E; color: #fff; }
  .lesson-title { font-size: 15.5px; font-weight: 500; }
  .lesson-status { font-size: 12.5px; color: var(--di-grey-mid); margin-top: 2px; }
  .lesson-status.done { color: #1E8E3E; }
  .chevron { color: var(--di-grey-mid); font-size: 18px; }

  .progress-track { height: 3px; background: var(--di-grey-line); }
  .progress-fill { height: 100%; background: var(--di-orange); transition: width .25s ease; }

  .chrome-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px 0; }
  .chrome-header .brand { font-size: 14px; font-weight: 700; color: var(--di-purple); }
  .step-label { font-size: 12px; color: var(--di-grey-mid); font-weight: 500; letter-spacing: .02em; }
  .chrome-footer { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; margin-top: auto; }
  .chrome-footer .brand-small { font-size: 11px; color: var(--di-grey-mid); font-weight: 700; letter-spacing: .04em; }
  .chrome-footer .date-stamp { font-size: 11.5px; color: var(--di-grey-mid); }

  #wizard { flex: 1; display: none; flex-direction: column; }
  .content-wrap { flex: 1; max-width: 640px; margin: 0 auto; padding: 44px 40px 20px; width: 100%; }
  .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--di-orange-deep); margin-bottom: 12px; display: block; }
  .content-wrap h2 { font-size: 26px; margin-bottom: 4px; }
  .rule { width: 40px; height: 3px; background: var(--di-orange); margin: 14px 0 22px; border: none; }
  .lede { font-size: 16px; color: #444; margin-bottom: 8px; }

  .outline-list { margin-top: 26px; }
  .outline-item { display: flex; align-items: baseline; gap: 16px; padding: 16px 0; border-top: 1px solid var(--di-grey-line); }
  .outline-item:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .outline-num { font-size: 13px; color: var(--di-grey-mid); font-weight: 700; min-width: 20px; }
  .outline-name { font-size: 16px; font-weight: 500; }

  .detail-section { margin-top: 28px; }
  .detail-label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); margin-bottom: 8px; }
  .detail-example { font-size: 14.5px; color: #333; background: var(--di-grey-light); padding: 14px 16px; border-radius: 8px; font-style: italic; }
  .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 6px; }
  @media (max-width: 560px) { .pros-cons { grid-template-columns: 1fr; gap: 18px; } }
  .pros-cons ul { margin: 0; padding-left: 18px; font-size: 14.5px; color: #333; }
  .pros-cons li { margin-bottom: 6px; }
  .pc-heading { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .pc-heading.pro { color: #1E8E3E; }
  .pc-heading.con { color: var(--di-orange-deep); }
  .differentiation-text { font-size: 14.5px; color: #333; }

  table.compare-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  table.compare-table th { text-align: left; padding: 8px 14px 8px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); border-bottom: 2px solid var(--di-ink); }
  table.compare-table td { padding: 16px 14px 16px 0; border-bottom: 1px solid var(--di-grey-line); vertical-align: top; }
  table.compare-table td:first-child { color: #666; }

  .why-block { font-size: 16.5px; line-height: 1.7; color: #222; }
  .why-block strong { color: var(--di-purple); }

  .nav-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px 8px; max-width: 640px; margin: 0 auto; width: 100%; gap: 12px; }
  .btn-text { background: none; border: none; color: var(--di-grey-mid); font-size: 14px; font-weight: 500; cursor: pointer; padding: 10px 4px; }
  .btn-text:hover { color: var(--di-ink); }
  .btn-text:disabled { visibility: hidden; }
  .btn-solid { background: var(--di-orange); color: #fff; border: none; font-weight: 700; font-size: 14.5px; padding: 12px 26px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  .btn-solid:hover { background: var(--di-orange-deep); }
  .btn-solid:disabled { background: #D9D9D9; color: #999; cursor: not-allowed; }
  .btn-outline { background: none; border: 1.5px solid var(--di-ink); color: var(--di-ink); font-weight: 700; font-size: 14.5px; padding: 11px 24px; border-radius: 10px; cursor: pointer; }
  .btn-outline:hover { background: var(--di-ink); color: #fff; }

  .quiz-question .q-title { font-weight: 500; font-size: 17px; margin-bottom: 18px; line-height: 1.5; }
  .option { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--di-grey-line); cursor: pointer; font-size: 14.5px; }
  .option:first-of-type { border-top: 1px solid var(--di-grey-line); }
  .option .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #BBB; flex-shrink: 0; position: relative; }
  .option.selected .dot { border-color: var(--di-purple); }
  .option.selected .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--di-purple); }
  .option.selected { color: var(--di-purple); font-weight: 500; }

  .review-answer-item { padding: 18px 0; border-top: 1px solid var(--di-grey-line); }
  .review-answer-item:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .review-answer-q { font-size: 14.5px; font-weight: 500; margin-bottom: 6px; }
  .review-answer-a { font-size: 14px; color: var(--di-purple); }
  .review-answer-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

  .score-ring-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 24px; }
  .score-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--di-grey-line); stroke-width: 10; }
  .ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1), stroke 0.3s ease; }
  .ring-fill.pass { stroke: #1E8E3E; }
  .ring-fill.fail { stroke: var(--di-orange-deep); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-score { font-size: 34px; font-weight: 700; line-height: 1; }
  .ring-score.pass { color: #1E8E3E; }
  .ring-score.fail { color: var(--di-orange-deep); }
  .ring-label { font-size: 12px; color: var(--di-grey-mid); margin-top: 5px; }

  #step-results .content-wrap { text-align: center; }
  .review-list { text-align: left; margin-top: 30px; }
  .review-item { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--di-grey-line); font-size: 13.5px; }
  .review-item .mark { font-weight: 700; flex-shrink: 0; }
  .review-item.right .mark { color: #1E8E3E; }
  .review-item.wrong .mark { color: var(--di-orange-deep); }
  .review-item em { color: #666; font-style: normal; }

  #step-complete .content-wrap { text-align: center; }
  .nav-row.centered-actions { justify-content: center; }
</style>
</head>
<body>
<div id="app">
  <div id="cover"></div>

  <div id="menu">
    <div class="menu-header"><span class="brand">Detector Inspector &nbsp;·&nbsp; Jotform Training</span></div>
    <div class="menu-wrap">
      <h2>Handling Jotform Cases</h2>
      <div class="menu-sub">6 lessons. Pick one to start or continue.</div>
      <div id="lessonList"></div>
    </div>
  </div>

  <div id="wizard">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="chrome-header">
      <span class="brand">Detector Inspector &nbsp;·&nbsp; Jotform Training</span>
      <span class="step-label" id="stepLabel"></span>
    </div>
    <div class="content-wrap" id="contentWrap"></div>
    <div class="nav-row" id="navRow"></div>
    <div class="chrome-footer">
      <span class="brand-small">DETECTOR INSPECTOR</span>
      <span class="date-stamp" id="dateStamp"></span>
    </div>
  </div>
</div>

<script>
var LESSONS = [
  {
    id: 1,
    title: "When a Case Goes to Jotform",
    blurb: "Every booking starts with booking staff trying IBA first. This lesson covers when a booking can be completed directly, and when it needs to be logged in Jotform instead.",
    sections: [
      {
        name: "Check IBA First",
        definition: "For every booking request, check IBA for a schedule that matches the tenant's preference.",
        example: "A booking request comes in for a property. You open IBA and check what's available against what the tenant asked for.",
        pros: ["Keeps every booking attempt starting the same way", "IBA is the fastest path when a slot is available"],
        cons: ["Don't skip straight to Jotform without checking IBA first"],
        differentiation: "IBA is always the <strong>first</strong> stop, not something you skip because it looks slow to check."
      },
      {
        name: "The Top 15 Rule",
        definition: "If a matching slot exists, it's convenient for the tenant, and it's ranked in IBA's top 15, offer it and complete the booking yourself. No need to escalate.",
        example: "IBA shows a slot that matches the tenant's preference and ranks 8th. You offer it and book it. Done.",
        pros: ["Keeps efficient bookings efficient", "No case is created if the booking can be completed directly"],
        cons: ["A slot ranked outside the top 15 doesn't count, even if it's otherwise a perfect match"],
        differentiation: "The top 15 rule applies only to <strong>booking staff</strong>. It's waived once a case reaches Jotform."
      },
      {
        name: "When to Log a Case in Jotform",
        definition: "If there's no schedule in IBA and the tenant has a preference, log the case in Jotform. Do the same if a schedule exists but isn't convenient for the tenant, or falls outside the top 15.",
        example: "IBA has no matching slot, but the tenant gave a clear preference through the Jotform link. You log the case in Jotform for the Jotform / Exceptions Team to pick up.",
        pros: ["Covers every situation where IBA can't get the booking done directly", "One consistent action, whatever the reason"],
        cons: ["Don't log a case if the tenant hasn't given a preference. There's nothing for Jotform to work from."],
        differentiation: "Logging a case in Jotform is <strong>escalating</strong> the booking, not giving up on it."
      }
    ],
    examples: [
      { weak: "Trying to book a slot outside the top 15 yourself", strong: "Logging the case in Jotform instead" },
      { weak: "Logging every booking in Jotform just to be safe", strong: "Only logging cases where IBA can't complete the booking directly" }
    ],
    why: "Booking staff are the first line. Getting the check-IBA-first habit right, and knowing exactly when to hand off, keeps bookings fast for the cases that don't need extra help, and gets the right cases to the team equipped to handle them.<br><br><strong>Check IBA. Top 15 and convenient? Book it. Otherwise, log it in Jotform.</strong>",
    questions: [
      { q: "IBA shows a slot that matches the tenant's preference and is convenient, ranked 20th. What do you do?", options: ["Book it, rank doesn't matter here", "Log the case in Jotform", "Ask the tenant to pick another time", "Wait for a better-ranked slot"], correct: 1 },
      { q: "What's the first thing booking staff check for any booking request?", options: ["OAS", "Sandbox", "IBA", "The tracker"], correct: 2 },
      { q: "IBA has no matching slot at all, and the tenant has given a preference. What do you do?", options: ["Log the case in Jotform", "Close the request", "Try OAS yourself", "Wait for the tenant to call"], correct: 0 },
      { q: "Which of these is NOT a reason to log a case in Jotform?", options: ["No schedule in IBA", "Schedule exists but isn't convenient", "Schedule exists, is convenient, and ranks in the top 15", "Schedule exists but falls outside the top 15"], correct: 2 }
    ]
  },
  {
    id: 2,
    title: "Picking Up a Logged Case",
    blurb: "Once a case lands in Jotform, it belongs to the Jotform / Exceptions Team. This lesson covers what happens the moment a case is picked up.",
    sections: [
      {
        name: "Identify the Preference",
        definition: "Start by identifying the tenant's preference for the case that's been logged.",
        example: "A case is logged in Jotform. Before doing anything else, you check what the tenant asked for.",
        pros: ["Makes sure you're solving for what the tenant actually wants", "Avoids offering a schedule they can't use"],
        cons: ["Don't skip this and jump straight to checking IBA"],
        differentiation: "This step is about the <strong>tenant's</strong> preference, not the booking system."
      },
      {
        name: "Every Case Is Now Yours",
        definition: "The Jotform / Exceptions Team owns every case logged in Jotform, including the rank-override rule, the OAS fallback, and the Sandbox/tracker step.",
        example: "A case arrives with no schedule in IBA. It's now the Jotform / Exceptions Team's job to work it through to a completed booking.",
        pros: ["One team, one clear owner for every logged case", "Nothing falls through the cracks between booking staff and Jotform"],
        cons: ["This is currently a pilot, so how it's working is still being reviewed"],
        differentiation: "Booking staff make the <strong>first attempt</strong>. Jotform / Exceptions <strong>finishes the job</strong>."
      }
    ],
    examples: [
      { weak: "Checking IBA again before confirming what the tenant wants", strong: "Identifying the tenant's preference first" },
      { weak: "Assuming booking staff already checked everything that's needed", strong: "Working the case through every remaining step yourself" }
    ],
    why: "A case that's been logged in Jotform still needs a clear first move. Confirming the tenant's preference before touching anything else means the rest of the process, whichever path it takes, starts from the right place.<br><br><strong>Confirm the preference first. Then the case is yours to finish.</strong>",
    questions: [
      { q: "What's the first thing you do with a newly logged case?", options: ["Check OAS", "Identify the tenant's preference", "Check the tracker", "Close the case"], correct: 1 },
      { q: "Who owns a case once it's logged in Jotform?", options: ["Booking staff", "The regional team", "The Jotform / Exceptions Team", "Whoever logged it"], correct: 2 },
      { q: "What is the current status of the Jotform / Exceptions Team owning these cases?", options: ["Permanent and final", "A pilot, being reviewed", "Optional, team's choice", "Only for Regional properties"], correct: 1 },
      { q: "Which of these does the Jotform / Exceptions Team NOT handle?", options: ["The rank-override rule", "The OAS fallback", "The Sandbox/tracker step", "Booking staff's first attempt in IBA"], correct: 3 }
    ]
  },
  {
    id: 3,
    title: "The Rank-Override Rule",
    blurb: "Once a case reaches Jotform, rank no longer blocks a booking the way it did for booking staff. This lesson covers exactly how the rank override works.",
    sections: [
      {
        name: "Rank No Longer Applies, 3-4+ Weeks Out",
        definition: "Check IBA again. Book any slot 3-4+ weeks from today, regardless of rank. This also covers preferences further out than IBA's own ~2-week generation window.",
        example: "A tenant's preference is five weeks away. IBA doesn't generate that far out yet, but once a slot in that window appears, you can book it whatever its rank.",
        pros: ["Opens up bookings the top 15 rule would have blocked", "Covers preferences the system hasn't generated slots for yet"],
        cons: ["This only applies once a case has reached Jotform. It doesn't apply back at booking staff"],
        differentiation: "<strong>3-4+ weeks from today</strong> is measured from the day you're making the booking, not the day the tenant submitted their preference."
      },
      {
        name: "Sooner Than 3-4 Weeks: Lowest Rank in the Week",
        definition: "If the tenant's preference doesn't allow for a 3-4+ week booking, still don't block on rank. Book the best-ranked (lowest rank number) slot available within that specific preferred week instead.",
        example: "The tenant wants next week. You don't wait for a top-15 slot. You take whichever slot has the lowest rank number within that week and book it.",
        pros: ["Keeps bookings moving even when the tenant wants something soon", "Still gives you a clear rule for which slot to pick"],
        cons: ["Don't default to the first slot you see. Compare ranks within that week first"],
        differentiation: "Sooner than 3-4 weeks <strong>still gets booked</strong>. It just uses a different tie-break: lowest rank in that week."
      }
    ],
    examples: [
      { weak: "Waiting for a top-15 slot once a case is already in Jotform", strong: "Booking any slot 3-4+ weeks out, or the lowest-rank slot in the tenant's specific week if sooner" },
      { weak: "Measuring \"3-4+ weeks\" from when the tenant submitted their preference", strong: "Measuring it from today, the day you're making the booking" }
    ],
    why: "Rank exists to keep bookings efficient, not to block them. Once a case is in Jotform, the rank-override rule gives you a clear way to keep moving whether the tenant's preference is weeks away or next week.<br><br><strong>3-4+ weeks out: any rank. Sooner: lowest rank in that week.</strong>",
    questions: [
      { q: "A tenant's preference is 6 weeks away. What rank does the slot need?", options: ["Top 15", "Top 5", "Rank doesn't matter", "No slot can be booked that far out"], correct: 2 },
      { q: "\"3-4+ weeks\" is measured from which date?", options: ["The date the tenant submitted their preference", "Today, the day the booking is being made", "The date the case was logged", "The date IBA last updated"], correct: 1 },
      { q: "The tenant wants a booking next week. What do you do?", options: ["Tell them it's not possible", "Book the lowest-rank slot available in that week", "Wait until it's 3-4 weeks away", "Only book if it's top 15"], correct: 1 },
      { q: "Where does the rank-override rule apply?", options: ["Everywhere, including booking staff's first attempt", "Only once a case has reached Jotform", "Only for Regional properties", "Only for vacant properties"], correct: 1 }
    ]
  },
  {
    id: 4,
    title: "OAS and Sandbox: When IBA Has Nothing",
    blurb: "IBA doesn't always have an answer. This lesson covers the fallback tools available once IBA runs out of options.",
    sections: [
      {
        name: "Check OAS Next",
        definition: "If no matching slot is found in IBA, check OAS, the old booking system. If a slot is found there, offer it and complete the booking manually.",
        example: "IBA has nothing under either rank-override rule. You check OAS and find a slot that works. You offer it to the tenant and book it manually.",
        pros: ["A second system to check before ruling out a booking entirely", "Manual booking is still a completed booking"],
        cons: ["OAS is a fallback here, not the first place to look"],
        differentiation: "IBA is checked <strong>first</strong> (twice, under the rank-override rule). OAS is the <strong>fallback</strong> once IBA has nothing."
      },
      {
        name: "Sandbox for Non-regional Properties",
        definition: "If there's no schedule in IBA or OAS, and the property is Non-regional, use Sandbox, together with the mapping system or Google Maps, to locate a technician, date and time. Offer it to the tenant and book manually.",
        example: "Neither IBA nor OAS has anything for a Non-regional property. You use Sandbox and a map to find a technician who can realistically get there, then offer that date and book it.",
        pros: ["Gives you a way forward when both systems come up empty", "Keeps the booking manual and deliberate, matched to a real technician"],
        cons: ["Sandbox is for Non-regional properties. Regional properties follow a different path (next lesson)"],
        differentiation: "Sandbox is <strong>Non-regional only</strong>. It's the last resort after IBA and OAS."
      }
    ],
    examples: [
      { weak: "Giving up on a booking once IBA has nothing available", strong: "Checking OAS, then Sandbox, before treating a Non-regional property as unbookable" },
      { weak: "Using Sandbox for a Regional property", strong: "Using Sandbox only for Non-regional properties" }
    ],
    why: "IBA is fast, but it isn't the only tool. OAS and Sandbox exist so that a case doesn't stall just because the newer system doesn't have an answer yet.<br><br><strong>No IBA? Try OAS. Still nothing, and it's Non-regional? Use Sandbox.</strong>",
    questions: [
      { q: "What do you check after IBA has no matching slot?", options: ["The tracker", "OAS, the old booking system", "Sandbox straight away", "Nothing, the case is closed"], correct: 1 },
      { q: "When do you use Sandbox?", options: ["Before checking IBA", "Before checking OAS", "When IBA and OAS both have nothing, for Non-regional properties", "For every Regional property"], correct: 2 },
      { q: "What do you use alongside Sandbox to find a technician?", options: ["The tracker", "A mapping system or Google Maps", "OAS", "IBA's extended options"], correct: 1 },
      { q: "A booking found through OAS is completed how?", options: ["Automatically by the system", "Manually, by you", "By the regional team", "It can't be completed through OAS"], correct: 1 }
    ]
  },
  {
    id: 5,
    title: "Regional Properties: The Tracker",
    blurb: "Regional properties follow a different fallback when nothing's available in IBA or OAS.",
    sections: [
      {
        name: "Log It in the Tracker",
        definition: "If there's no schedule in IBA or OAS, and the property is Regional, log the case in the tracker.",
        example: "IBA and OAS both have nothing for a Regional property. Instead of Sandbox, you log the case in the tracker for the regional team.",
        pros: ["Regional bookings depend on trip planning, so they go through the tracker instead of a one-off manual search", "Keeps regional trip arrangements organised in one place"],
        cons: ["Don't use Sandbox for a Regional property. That path is Non-regional only"],
        differentiation: "Non-regional goes to <strong>Sandbox</strong>. Regional goes to the <strong>tracker</strong>."
      },
      {
        name: "Wait for the Regional Team, Then Close the Loop",
        definition: "Once the regional team arranges a trip and leaves notes in the tracker, contact the tenant, offer the schedule, and complete the booking.",

        example: "A tenant's preference falls outside the top 15 in IBA. Booking staff log the case in Jotform. The Jotform / Exceptions Team confirms the preference, rechecks IBA under the rank-override rule, and books a slot 3-4+ weeks out at whatever rank is available.",
        pros: ["One process for every case, from first attempt to completed booking", "Easy to follow and easy to check"],
        cons: ["Skipping a step, like the OAS check, can mean missing a booking that was already possible"],
        differentiation: "Booking staff decide <strong>whether</strong> a case goes to Jotform. The Jotform / Exceptions Team decides <strong>how</strong> it gets booked from there."
      }
    ],
    examples: [
      { weak: "Handling each case from memory, in a different order each time", strong: "Following the same order every time: IBA, rank-override IBA, OAS, then Sandbox or the tracker" },
      { weak: "Treating Regional and Non-regional properties the same at the final fallback step", strong: "Using Sandbox for Non-regional and the tracker for Regional" }
    ],

      { q: "A booking request comes in. IBA has a matching, convenient slot ranked 5th. What happens?", options: ["Booking staff offer it and complete the booking. Done", "Log it in Jotform anyway", "Check OAS first", "Escalate to the regional team"], correct: 0 },
      { q: "A case is logged in Jotform. The tenant's preference is 4 weeks away. What's the rule?", options: ["Book any slot in IBA that matches, regardless of rank", "Only book if it's top 15", "Wait until it's exactly 4 weeks", "Use Sandbox instead of IBA"], correct: 0 },
      { q: "IBA and OAS both have nothing. The property is Non-regional. What next?", options: ["Log it in the tracker", "Use Sandbox and a mapping system to find a technician", "Close the case", "Wait for the regional team"], correct: 1 },
      { q: "IBA and OAS both have nothing. The property is Regional. What next?", options: ["Use Sandbox", "Log it in the tracker and wait for the regional team's note", "Book any available slot regardless of location", "Close the case"], correct: 1 }
    ]
  }
];

var PASS_FRACTION = 0.75;
var STEPS = [];
var current = 0;
var activeLesson = null;
var quizAnswers = [];
var lastScore = null;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem("jotform-lms-progress") || "{}"); } catch(e) { return {}; }
}
function saveProgress(lessonId, correctCount, total) {
  try {
    var prog = loadProgress();
    var prev = prog[lessonId] || { best: 0, total: total };
    prog[lessonId] = { best: Math.max(prev.best, correctCount), total: total };
    localStorage.setItem("jotform-lms-progress", JSON.stringify(prog));
  } catch(e) {}
}

function showCover() {
  document.getElementById("cover").innerHTML =
    '<div class="notion-logo">📥</div>' +
    '<h1>Handling Jotform Cases</h1>' +
    '<p>A practical training course for Detector Inspector booking staff and the Jotform / Exceptions Team on handling cases that can’t be booked directly through IBA. Learn at your own pace &mdash; pick up where you left off any time.</p>' +
    '<button class="btn-solid" onclick="showMenu()">View lessons</button>';
  document.getElementById("cover").style.display = "flex";
  document.getElementById("menu").style.display = "none";
  document.getElementById("wizard").style.display = "none";
}

function showMenu() {
  document.getElementById("cover").style.display = "none";
  document.getElementById("wizard").style.display = "none";
  var menu = document.getElementById("menu");
  menu.style.display = "flex";
  var progress = loadProgress();
  var list = document.getElementById("lessonList");
  list.innerHTML = LESSONS.map(function(lesson) {
    var p = progress[lesson.id];
    var passed = p && (p.best / p.total) >= PASS_FRACTION;
    var status = !p ? "Not started" : (passed ? "Completed — " + p.best + "/" + p.total : "Best score " + p.best + "/" + p.total + " — not yet passed");
    return '<div class="lesson-row" data-lesson-id="' + lesson.id + '">' +
      '<div class="lesson-row-left">' +
      '<div class="lesson-num' + (passed ? " done" : "") + '">' + (passed ? "✓" : String(lesson.id).padStart(2, "0")) + '</div>' +
      '<div><div class="lesson-title">' + lesson.title + '</div><div class="lesson-status' + (passed ? " done" : "") + '">' + status + '</div></div>' +
      '</div><div class="chevron">›</div></div>';
  }).join("");
  list.querySelectorAll(".lesson-row").forEach(function(row) {
    row.addEventListener("click", function() {
      startLesson(parseInt(row.getAttribute("data-lesson-id"), 10));
    });
  });
}

function stepIndexOf(type, extra) {
  for (var i = 0; i < STEPS.length; i++) {
    if (STEPS[i].type === type && (extra === undefined || STEPS[i].qIndex === extra)) return i;
  }
  return 0;
}

function startLesson(lessonId) {
  activeLesson = LESSONS.find(function(l) { return l.id === lessonId; });
  quizAnswers = new Array(activeLesson.questions.length).fill(null);
  lastScore = null;
  STEPS = [];
  STEPS.push({ type: "overview" });
  activeLesson.sections.forEach(function(s, i) { STEPS.push({ type: "detail", index: i }); });
  STEPS.push({ type: "example" });
  STEPS.push({ type: "why" });
  activeLesson.questions.forEach(function(q, qi) { STEPS.push({ type: "question", qIndex: qi }); });
  STEPS.push({ type: "quiz-review" });
  STEPS.push({ type: "results" });
  STEPS.push({ type: "complete" });
  current = 0;
  document.getElementById("menu").style.display = "none";
  document.getElementById("wizard").style.display = "flex";
  renderStep();
}

function goNext() { if (current < STEPS.length - 1) { current++; renderStep(); } }
function goBack() { if (current > 0) { current--; renderStep(); } }
function jumpTo(idx) { current = idx; renderStep(); }

function renderStep() {
  var step = STEPS[current];
  var wrap = document.getElementById("contentWrap");
  var nav = document.getElementById("navRow");
  var label = document.getElementById("stepLabel");
  var progressFill = document.getElementById("progressFill");
  var L = activeLesson;

  var pct = Math.round(((current + 1) / STEPS.length) * 100);
  progressFill.style.width = pct + "%";
  label.textContent = "Lesson " + String(L.id).padStart(2, "0") + " · Step " + (current + 1) + " of " + STEPS.length;

  var backDisabled = current === 0;
  var html = "";
  var showDefaultNav = true;

  if (step.type === "overview") {
    html = '<span class="tag">Lesson ' + String(L.id).padStart(2, "0") + '</span>' +
      '<h2>' + L.title + '</h2><hr class="rule">' +
      '<p class="lede">' + L.blurb + '</p>' +
      (L.sections.length > 1 ? '<div class="outline-list">' + L.sections.map(function(s, i) {
        return '<div class="outline-item"><span class="outline-num">0' + (i + 1) + '</span><span class="outline-name">' + s.name + '</span></div>';
      }).join("") + '</div><p class="lede" style="margin-top:22px; font-size:14.5px; color:#666;">We’ll go through each one in turn.</p>' : '');
  } else if (step.type === "detail") {
    var el = L.sections[step.index];
    html = '<span class="tag">' + (L.sections.length > 1 ? ("Part " + (step.index + 1) + " of " + L.sections.length) : "Key idea") + '</span>' +
      '<h2>' + el.name + '</h2><hr class="rule">' +
      '<p class="lede">' + el.definition + '</p>' +
      '<div class="detail-section"><div class="detail-label">Example</div><div class="detail-example">' + el.example + '</div></div>' +
      '<div class="detail-section pros-cons">' +
      '<div><div class="pc-heading pro">Why it helps</div><ul>' + el.pros.map(function(p) { return "<li>" + p + "</li>"; }).join("") + '</ul></div>' +
      '<div><div class="pc-heading con">Watch out for</div><ul>' + el.cons.map(function(c) { return "<li>" + c + "</li>"; }).join("") + '</ul></div>' +
      '</div>' +
      '<div class="detail-section"><div class="detail-label">How it fits in</div><div class="differentiation-text">' + el.differentiation + '</div></div>';
  } else if (step.type === "example") {
    html = '<span class="tag">Putting it together</span>' +
      '<h2>Common patterns &mdash; before &amp; after</h2><hr class="rule">' +
      '<p class="lede">Real situations from this lesson.</p>' +
      '<table class="compare-table"><tr><th>Common mistake</th><th>Better approach</th></tr>' +
      L.examples.map(function(ex) { return '<tr><td>' + ex.weak + '</td><td>' + ex.strong + '</td></tr>'; }).join("") +
      '</table>';
  } else if (step.type === "why") {
    showDefaultNav = false;
    html = '<span class="tag">Why it matters</span>' +
      '<h2>Wrapping up this lesson</h2><hr class="rule">' +
      '<div class="why-block"><p>' + L.why + '</p></div>' +
      '<div class="nav-row" style="padding:28px 0 0;">' +
      '<button class="btn-text" onclick="goBack()">Back</button>' +
      '<button class="btn-solid" onclick="jumpTo(stepIndexOf(\'question\', 0))">Lesson complete — start the check</button></div>';
  } else if (step.type === "question") {
    showDefaultNav = false;
    var qi = step.qIndex;
    var item = L.questions[qi];
    var isLast = qi === L.questions.length - 1;
    html = '<span class="tag">Quick check &middot; Question ' + (qi + 1) + ' of ' + L.questions.length + '</span>' +
      '<div class="quiz-question"><div class="q-title">' + item.q + '</div>' +
      item.options.map(function(opt, oi) {
        var isSelected = quizAnswers[qi] === oi;
        return '<label class="option' + (isSelected ? " selected" : "") + '" data-oi="' + oi + '">' +
          '<span class="dot"></span><span>' + opt + '</span></label>';
      }).join("") + '</div>' +
      '<div class="nav-row" style="padding:24px 0 0;">' +
      '<button class="btn-text" onclick="goBack()">Back</button>' +
      '<button class="btn-solid" id="questionNextBtn" onclick="' + (isLast ? "jumpTo(stepIndexOf('quiz-review'))" : "goNext()") + '" disabled>' +
      (isLast ? "Review answers" : "Next") + '</button></div>';
  } else if (step.type === "quiz-review") {
    showDefaultNav = false;
    html = '<span class="tag">Before you submit</span>' +
      '<h2>Review your answers</h2><hr class="rule">' +
      '<p class="lede" style="margin-bottom:6px;">Check each one — tap “Change” to update an answer.</p>' +
      L.questions.map(function(item, qi) {
        var picked = quizAnswers[qi] !== null ? item.options[quizAnswers[qi]] : "— not answered —";
        return '<div class="review-answer-item"><div class="review-answer-row">' +
          '<div><div class="review-answer-q">' + (qi + 1) + '. ' + item.q + '</div>' +
          '<div class="review-answer-a">' + picked + '</div></div>' +
          '<a class="link-btn" onclick="jumpTo(stepIndexOf(\'question\', ' + qi + '))">Change</a></div></div>';
      }).join("") +
      '<div class="nav-row" style="padding:24px 0 0;">' +
      '<button class="btn-text" onclick="jumpTo(stepIndexOf(\'question\', ' + (L.questions.length - 1) + '))">Back</button>' +
      '<button class="btn-solid" onclick="submitQuiz()">Submit answers</button></div>';
  } else if (step.type === "results") {
    showDefaultNav = false;
    var total = L.questions.length;
    var correctCount = lastScore === null ? 0 : lastScore;
    var fraction = correctCount / total;
    var passed = fraction >= PASS_FRACTION;
    html = '<div class="score-ring-wrap"><svg viewBox="0 0 160 160"><circle class="ring-track" cx="80" cy="80" r="70"></circle>' +
      '<circle class="ring-fill ' + (passed ? "pass" : "fail") + '" id="ringFill" cx="80" cy="80" r="70"></circle></svg>' +
      '<div class="ring-center"><div class="ring-score ' + (passed ? "pass" : "fail") + '">' + correctCount + '/' + total + '</div>' +
      '<div class="ring-label">correct</div></div></div>' +
      '<h2 style="font-size:19px;">' + (passed ? "You’ve got this lesson." : "Worth another pass through this lesson.") + '</h2>' +
      '<p style="max-width:420px; margin:10px auto 0; color:#555; font-size:14.5px;">' +
      "You scored " + correctCount + " out of " + total + " (" + Math.round(fraction * 100) + "%), " +
      (passed ? "above" : "below") + " the 75% pass mark" + (passed ? "." : " needed to move on.") + '</p>' +
      '<div class="review-list" id="reviewList"></div>' +
      '<div class="nav-row" style="padding:24px 0 0;">' +
      '<button class="btn-outline" onclick="jumpTo(0)">Review lesson again</button>' +
      (passed ? '<button class="btn-solid" onclick="goNext()">Finish lesson</button>' : '<button class="btn-solid" onclick="retakeQuiz()">Retake quiz</button>') +
      '</div>';
  } else if (step.type === "complete") {
    showDefaultNav = false;
    html = '<span class="tag">Nice work</span>' +
      '<h2>You’ve completed Lesson ' + String(L.id).padStart(2, "0") + '</h2><hr class="rule">' +
      '<p class="lede">' + L.title + ' — done.</p>' +
      '<div class="nav-row centered-actions" style="padding:24px 0 0;">' +
      '<button class="btn-outline" onclick="retakeQuiz()">Retake quiz</button>' +
      '<button class="btn-solid" onclick="showMenu()">Back to all lessons</button></div>';
  }

  wrap.innerHTML = html;
  if (showDefaultNav) {
    nav.style.display = "flex";
    nav.innerHTML = '<button class="btn-text" onclick="goBack()" ' + (backDisabled ? "disabled" : "") + '>Back</button>' +
      '<button class="btn-solid" onclick="goNext()">Next</button>';
  } else {
    nav.style.display = "none";
    nav.innerHTML = "";
  }
  if (step.type === "question") { wireQuestionOptions(step.qIndex); }
  if (step.type === "results") { renderReview(); drawScoreRing(); }
}

function wireQuestionOptions(qi) {
  var wrap = document.getElementById("contentWrap");
  wrap.querySelectorAll(".option").forEach(function(label) {
    label.addEventListener("click", function() {
      quizAnswers[qi] = parseInt(label.getAttribute("data-oi"), 10);
      renderStep();
    });
  });
  var nextBtn = document.getElementById("questionNextBtn");
  if (nextBtn) nextBtn.disabled = quizAnswers[qi] === null;
}

function submitQuiz() {
  var correctCount = 0;
  activeLesson.questions.forEach(function(item, qi) { if (quizAnswers[qi] === item.correct) correctCount++; });
  lastScore = correctCount;
  saveProgress(activeLesson.id, correctCount, activeLesson.questions.length);
  jumpTo(stepIndexOf("results"));
}

function renderReview() {
  var reviewList = document.getElementById("reviewList");
  if (!reviewList) return;
  reviewList.innerHTML = activeLesson.questions.map(function(item, qi) {
    var isRight = quizAnswers[qi] === item.correct;
    return '<div class="review-item ' + (isRight ? "right" : "wrong") + '">' +
      '<span class="mark">' + (isRight ? "✓" : "✗") + '</span>' +
      '<span>Q' + (qi + 1) + ': ' + item.q + '<br><em>Correct answer: ' + item.options[item.correct] + '</em></span></div>';
  }).join("");
}

function drawScoreRing() {
  var circle = document.getElementById("ringFill");
  if (!circle) return;
  var total = activeLesson.questions.length;
  var correctCount = lastScore === null ? 0 : lastScore;
  var fraction = total > 0 ? correctCount / total : 0;
  var r = 70;
  var circumference = 2 * Math.PI * r;
  circle.style.transition = "none";
  circle.setAttribute("stroke-dasharray", circumference);
  circle.setAttribute("stroke-dashoffset", circumference);
  circle.getBoundingClientRect();
  requestAnimationFrame(function() {
    circle.style.transition = "";
    circle.setAttribute("stroke-dashoffset", circumference * (1 - fraction));
  });
}

function retakeQuiz() {
  quizAnswers = new Array(activeLesson.questions.length).fill(null);
  lastScore = null;
  jumpTo(stepIndexOf("question", 0));
}

function setDate() {
  var d = new Date();
  document.getElementById("dateStamp").textContent = d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
setDate();
showCover();
</script>

</html>
